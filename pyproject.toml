[project]
name = "mospi-cpi"
version = "0.1.0"
description = "End-to-end MoSPI CPI analytics, PostgreSQL pipeline, Power BI dashboard, and temporal ML experiments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.3.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "psycopg2>=2.9.12",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.0.52",
]

[project.scripts]
mospi-cpi = "mospi_cpi.main:main"

[build-system]
requires = ["uv_build>=0.8.0,<0.13.0"]
build-backend = "uv_build"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
